<html>
<head>
    <title>Feedback Form</title>
</head>

<body>

<form>

    <fieldset>
        <legend>Contact information:</legend>

        <table>
            <tr>
                <td>
                    <input type="text" id="firstName" name="firstName"
                           placeholder="First name">
                </td>

                <td rowspan="4">
                    
                    <strong>Preferred contact method:</strong>
                    <br><br>
                    

                    <input type="checkbox" id="emailContact"
                           name="contactMethod" value="email">
                    <label for="telephoneContact">Email</label>
                    
                    

                    <br><br>

                    <input type="checkbox" id="telephoneContact"
                           name="contactMethod" value="telephone">
                    <label for="emailContact">Telephone</label>
                    <br>

                    
                </td>
            </tr>

            <tr>
                <td>
                    <input type="text" id="lastName" name="lastName"
                           placeholder="Last name">
                    
                    
                </td>
            </tr>

            <tr>
                <td>
                    <input type="email" id="email" name="email"
                           placeholder="Email">
                </td>
            </tr>

            <tr>
                <td>
                    <input type="tel" id="telephone" name="telephone"
                           placeholder="Telephone">
                </td>
            </tr>
        </table>

    </fieldset>


    <fieldset>
        <legend>Feedback:</legend>

        <table>
            <tr>
                <td>
                    <input type="text" id="subject" name="subject"
                           placeholder="Message subject">
                </td>
            </tr>
        </table>

        <br>

        <textarea name="message" rows="15" cols="80"></textarea>

        <br><br>

        <label for="file">Attach a file:</label>
        <input type="file" id="file" name="file">

        <br><br>

        <hr>

        <input type="submit" value="Send">

    </fieldset>

</form>

</body>
</html>
